configurations.implementation {
    exclude group: 'com.vaadin', module: 'hilla'
    exclude group: 'com.vaadin', module: 'hilla-dev'
}

tasks.named('compileTestJava') {
    dependsOn = ['processTestResources']
}

// Unit tests only (fast, runs on every PR/commit)
test {
    useJUnitPlatform()
    dependsOn = ['testClasses']
    include '**/unit/**'

    def allureDir = layout.buildDirectory.dir("allure-results").get().asFile.absolutePath
    def selenideDir = layout.buildDirectory.dir("reports/tests").get().asFile.absolutePath
    systemProperty 'allure.results.directory', allureDir
    systemProperty 'selenide.reportsFolder', selenideDir
}

// UI tests (slow, runs nightly against remote dev server)
// Usage:
//   ./gradlew uiTest -PbaseUrl=https://<your-host> \
//                    -Pselenide.remote=http://<selenium-grid-host>:4444/wd/hub \
//                    -Pselenide.headless=true \
//                    -Ptest.user=<test-user> \
//                    -Ptest.password=...
tasks.register('uiTest', Test) {
    description = 'Run UI tests against remote server (skips Vaadin frontend build)'
    group = 'verification'

    useJUnitPlatform()
    dependsOn = ['testClasses']

    include '**/ui_autotest/**'

    def allureDir = layout.buildDirectory.dir("allure-results").get().asFile.absolutePath
    def selenideDir = layout.buildDirectory.dir("reports/tests").get().asFile.absolutePath
    systemProperty 'allure.results.directory', allureDir
    systemProperty 'selenide.reportsFolder', selenideDir

    // Pass-through properties (override via -P flags or system env)
    systemProperty 'baseUrl', findProperty('baseUrl') ?: System.getProperty('baseUrl', 'https://<your-host>')
    systemProperty 'selenide.headless', findProperty('selenide.headless') ?: System.getProperty('selenide.headless', 'true')
    systemProperty 'selenide.remote', findProperty('selenide.remote') ?: System.getProperty('selenide.remote', '')
    systemProperty 'test.user', findProperty('test.user') ?: System.getProperty('test.user', '')
    systemProperty 'test.password', findProperty('test.password') ?: System.getProperty('test.password', '')

    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
        exceptionFormat = 'short'
    }

    // Always show test execution summary
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "\nUI Test Results: ${result.resultType} " +
                    "(${result.testCount} tests, " +
                    "${result.successfulTestCount} passed, " +
                    "${result.failedTestCount} failed, " +
                    "${result.skippedTestCount} skipped)"
        }
    }
}

// Skip Vaadin frontend build for tasks that don't need it (test, uiTest, etc.)
// Vaadin tasks only run for actual app bundling (bootJar, bootRun, build, assemble)
def vaadinNeededTasks = ['bootJar', 'bootRun', 'bootBuildImage', 'build', 'assemble', 'war', 'bootWar']
def vaadinFrontendTasks = ['vaadinPrepareFrontend', 'vaadinBuildFrontend', 'hillaGenerate']
tasks.matching { it.name in vaadinFrontendTasks }.configureEach {
    onlyIf {
        gradle.startParameter.taskNames.any { taskName ->
            vaadinNeededTasks.any { needed -> taskName.endsWith(needed) || taskName == needed }
        }
    }
}
